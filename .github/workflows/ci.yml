name: CI - Build, Test, Scan & Push to ECR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 679965617139.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  test-and-lint:
    name: Lint & Unit Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install flake8 pytest

      - name: Run Flake8 Linter
        run: flake8 .

      - name: Run Pytest Unit Tests
        run: pytest

  build-scan-push:
    name: Build, Trivy Scan & Push to ECR
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend & Frontend Images
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/taskboard-backend:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/taskboard-backend:latest ./app/backend
          docker build -t ${{ env.ECR_REGISTRY }}/taskboard-frontend:${{ github.sha }} -t ${{ env.ECR_REGISTRY }}/taskboard-frontend:latest ./app/frontend

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/taskboard-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/taskboard-frontend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Images to AWS ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/taskboard-backend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/taskboard-backend:latest
          docker push ${{ env.ECR_REGISTRY }}/taskboard-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/taskboard-frontend:latest
