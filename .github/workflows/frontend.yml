name: Frontend

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/actions/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scanners read the commit history

      # 1. Scan the files and secrets, and run the code quality check
      - name: Pre-build scan
        uses: ./.github/actions/pre-build-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ vars.SONAR_HOST_URL }}
          sonar-organization: ${{ vars.SONAR_ORGANIZATION }}
          sonar-project-key: omaryehia1_taskboard-frontend
          sonar-project-dir: app/frontend
          report-name: frontend-pre-build-report

      # 2. Build the website
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Lint
        working-directory: app/frontend
        run: npm run lint

      - name: Type check
        working-directory: app/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: app/frontend
        run: npm run build

      # 3. Scan the built website (the out/ folder)
      - name: Post-build scan
        uses: ./.github/actions/post-build-scan
        with:
          scan-type: fs
          target: app/frontend/out
          report-name: frontend-post-build-report