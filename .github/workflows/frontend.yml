name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-scan:
    name: Test & SonarQube Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests with coverage
        run: npm run test:coverage --if-present

      - name: Run Pre-Scan Composite Action
        uses: ./.github/actions/pre-build-scan

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: app/frontend
          args: >
            -Dsonar.organization=omaryehia1
            -Dsonar.projectKey=omaryehia1_taskboard-frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  build-and-push:
    name: Build, Container Scan & ECR Push
    needs: test-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/taskboard-frontend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/taskboard-frontend:latest \
            ./app/frontend

      - name: Run Post-Scan Composite Action
        uses: ./.github/actions/post-build-scan
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/taskboard-frontend:${{ github.sha }}

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/taskboard-frontend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/taskboard-frontend:latest