name: Helm Lint & Test

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: |
          helm lint deploy/helm/taskboard

      - name: Helm Template (Dry Run with Prod Values)
        run: |
          helm template taskboard deploy/helm/taskboard \
            -f deploy/helm/taskboard/values-prod.yaml \
            --namespace prod > rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas rendered-manifests.yaml