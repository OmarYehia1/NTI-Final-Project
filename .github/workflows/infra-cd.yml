name: Infrastructure CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-cd.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-cd.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Also run apply after the plan (needs approval)'
        type: boolean
        default: false

permissions:
  id-token: write # log in to AWS with OIDC
  contents: read

# Two Terraform runs must never touch the state at the same time
concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # Runs on pull requests, pushes to main and manual runs. Changes nothing in AWS.
  plan:
    name: Scan, validate and plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scanners read the commit history

      # 1. Security scan of the Terraform code (Trivy) and secrets.
      #    The SonarQube step inside this action is skipped because no token is given.
      - name: Security scan
        uses: ./.github/actions/pre-build-scan
        with:
          report-name: infra-scan-report

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive ../../

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        shell: bash
        run: |
          terraform plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Only on main. The job waits until you approve it in the "infrastructure" environment.
  apply:
    name: Apply (needs approval)
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply))
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -auto-approve -input=false