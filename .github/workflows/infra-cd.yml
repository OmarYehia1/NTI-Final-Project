name: Infrastructure CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-cd.yml'
#  push:
 #   branches: [main]
  #  paths:
   #   - 'infra/**'
    #  - '.github/workflows/infra-cd.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # Triggered on Pull Requests: Generates plan only
      - name: Terraform Plan (PR)
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # Manual workflow triggers (plan / apply / destroy)
      - name: Terraform Manual Plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
        run: terraform plan

      - name: Terraform Manual Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: Terraform Manual Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      # Automatic apply on push to main (if not triggered via workflow_dispatch)
      - name: Terraform Auto Apply (Push to Main)
        if: github.event_name == 'push'
        run: terraform apply -auto-approve