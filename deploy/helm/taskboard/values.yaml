backend:
  replicaCount: 1
  image:
    repository: taskboard-backend
    tag: local
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  image:
    repository: postgres
    tag: 17-alpine
  storage:
    size: 1Gi
targetGroupBinding:
  enabled: false
  targetGroupARN: ""
secrets:
  mode: local
  external:
    secretName: taskboard/prod/db-password
    region: eu-west-1