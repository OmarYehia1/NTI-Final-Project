apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: {{ .Values.frontend.backendUrl | quote }}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
spec:
  type: ClusterIP
  selector:
    app: taskboard-frontend
  ports:
    - port: 3000
      targetPort: 8080
      protocol: TCP