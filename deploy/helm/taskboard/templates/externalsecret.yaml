{{- if eq .Values.secrets.mode "external" }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.external.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taskboard-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: taskboard-secret
    template:
      data:
        DB_HOST: "db"
        DB_PORT: "5432"
        DB_NAME: "taskboard"
        DB_USER: "taskboard"
        DB_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.external.secretName }}
{{- end }}