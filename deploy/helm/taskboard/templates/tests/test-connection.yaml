apiVersion: v1
kind: Pod
metadata:
  name: taskboard-test-connection
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: wget
      image: busybox
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ['wget']
      args: ['-qO-', 'http://backend:8000/api/health']
  restartPolicy: Never