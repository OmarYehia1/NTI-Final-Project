apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskboard-postgres
spec:
  serviceName: "db"
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskboard
            - name: POSTGRES_USER
              value: taskboard
            - name: POSTGRES_PASSWORD
              value: "taskboardpassword"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi